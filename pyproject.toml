[project]
name = "ai-raccoon-scripts"
version = "0.1.0"
# Raised from >=3.9: numpy (>=3.12) and scikit-learn (>=3.11) already need
# newer than that at their current releases, so >=3.9 was dishonest the
# moment these deps got declared. See docs/plans/2026-08-14-project-scope-improvement-plan.md WP18.
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "numpy",
    "scikit-learn",
    "pytest",
    "optuna>=4.9.0",
    # Harness pins (review: 5 floating heavy deps). Exact pins recorded from the
    # resolving env 2026-09-09 (chromadb 1.5.9, llama-index 0.14.24, hf-embed 0.8.0,
    # torch 2.13.0, sqlite-vec 0.1.9): a tuning harness must resolve identically
    # everywhere or its numbers are not comparable across machines.
    "chromadb==1.5.9",
    "llama-index==0.14.24",
    "llama-index-embeddings-huggingface==0.8.0",
    "torch==2.13.0",
    "sqlite-vec==0.1.9",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts/src"]
