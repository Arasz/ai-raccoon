name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-fast:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        # nuget.config references the gitignored local feed .nupkg-local/; make it
        # exist on the fresh runner or restore fails with NU1301.
        run: mkdir -p .nupkg-local && dotnet build --nologo
      - name: Fast tests
        # Speed=Fast only; Speed=Slow is gated by build-slow below and BDD by
        # build-bdd. The three filters together cover the suite — see
        # tests/AiRaccoon.Tests/TestCategories.cs for the trait split.
        run: dotnet test --filter "Speed=Fast" --no-build --nologo -v m

  build-bdd:
    # Separate job, not a second step: it runs beside build-fast rather than after
    # it, so gating the BDD scenarios costs concurrency instead of wall-clock.
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: mkdir -p .nupkg-local && dotnet build --nologo
      - name: BDD scenarios
        # Category=bdd comes from the @bdd tag on each feature file. The scenarios
        # carry no Speed trait, so Speed=Fast never matched them and they gated
        # nothing until this job existed. BddGateCoverageTests fails if a feature
        # file is ever added without the tag.
        run: dotnet test --filter "Category=bdd" --no-build --nologo -v m

  build-slow:
    # The integration/E2E gate. Until 2026-08-08 nothing in the PR gate ran these:
    # build-fast filters Speed=Fast and build-bdd filters Category=bdd, so every
    # Speed=Slow test was merged unverified. #126 landed four red ingest tests
    # through a fully green PR that way. nightly.yml was the nominal backstop and
    # had failed on every run it ever had, so it could not signal anything.
    #
    # Runs beside the other two jobs, so the coverage costs concurrency, not wall
    # clock (measured: the full suite is ~3m30s of test time).
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # #150: one SIGBUS (exit 135) test-host crash was observed here with no
      # diagnostic evidence; capture a crash dump so a recurrence is debuggable.
      DOTNET_DbgEnableMiniDump: 1
      DOTNET_DbgMiniDumpType: 2
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/dumps/coredump.%p.dmp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: mkdir -p .nupkg-local && dotnet build --nologo
      - name: Prepare dump directory
        run: mkdir -p dumps
      - name: Slow tests (integration + E2E)
        # GoldenFileTests skips itself off osx-arm64 — the golden reference is a
        # host-specific ONNX artifact, not a portable expectation.
        run: dotnet test --filter "Speed=Slow" --no-build --nologo -v m
      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-slow-dumps
          path: dumps/
          if-no-files-found: ignore
