name: build

# No `paths:`/`paths-ignore:` filter on `pull_request:` below — on purpose.
#
# build-fast, build-bdd and build-slow are required status checks (see the
# repository ruleset). If this workflow were trigger-filtered to skip doc-only
# PRs, those checks would simply never report on such a PR, and branch
# protection would block it forever waiting for a check that will never
# arrive. That is not hypothetical: this workflow used to carry exactly that
# `paths:` filter on `pull_request:`, and PR #301 (docs/work/checklist only)
# merged with none of the three required checks in its status rollup — it
# went through only because the merging account has ruleset bypass. Anyone
# without bypass would have been stuck.
#
# Instead, the workflow always triggers and each heavy job always runs (see
# `changes` below): a cheap diff classifies the PR, and build-fast/build-bdd/
# build-slow skip their expensive steps — but the *job* itself still executes
# and still reports success, which is what branch protection needs to see.
on:
  push:
    branches: [main]
  pull_request:
    # `labeled` added (Q2, delta review fix plan) so applying `run-nightly-gates` triggers
    # build-nightly-gates below without needing a new push. This re-triggers the whole workflow
    # on every label change, including unrelated ones — build-fast/build-bdd/build-slow already
    # tolerate redundant runs cheaply via the `changes` skip-logic above, so the extra cost is one
    # more cheap pass-through, not a second full test run.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch: {}

permissions:
  contents: read

# Superseded PR pushes cancel their in-flight run; main pushes never cancel, so
# every main run stays a complete record.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # Single source of truth for "does this diff affect build/test outcome".
    # build-fast/build-bdd/build-slow each read this job's `code` output and
    # skip their expensive steps when it is 'false' — see the note on
    # `pull_request:` above for why this lives in a job instead of a trigger
    # filter.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify the diff
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Mirrors the paths this workflow used to trigger on. Anything not
          # matched here (docs/**, *.md, etc.) is treated as safe to skip.
          CODE_REGEX='^src/.*\.cs$|^tests/.*\.cs$|\.csproj$|\.sln$|(^|/)Directory\.Build\.props$|(^|/)Directory\.Packages\.props$|\.feature$|\.onnx$|^nuget\.config$|^scripts/verify-tool-package\.py$|^\.github/workflows/build\.yml$'

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable base commit (new branch or force-push); treating as a code change."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE "$CODE_REGEX"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-fast:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Skip (doc-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-relevant paths changed; skipping build and tests."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.code == 'true'
        with:
          # Pinned via global.json, not a floating 10.0.x. An unpinned SDK is a mutable
          # dependency re-resolved on every run — the same hazard this workflow already
          # avoids by pinning every action to a commit SHA.
          global-json-file: global.json
      - name: Build
        if: needs.changes.outputs.code == 'true'
        # nuget.config references the gitignored local feed .nupkg-local/; make it
        # exist on the fresh runner or restore fails with NU1301.
        run: mkdir -p .nupkg-local && dotnet build --nologo
      - name: Fast tests
        if: needs.changes.outputs.code == 'true'
        # Speed=Fast only; Speed=Slow is gated by build-slow below and BDD by
        # build-bdd. The three filters together cover the suite — see
        # tests/AiRaccoon.Tests/TestCategories.cs for the trait split.
        run: dotnet test --filter "Speed=Fast" --no-build --nologo -v m

  build-bdd:
    # Separate job, not a second step: it runs beside build-fast rather than after
    # it, so gating the BDD scenarios costs concurrency instead of wall-clock.
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Skip (doc-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-relevant paths changed; skipping build and tests."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.code == 'true'
        with:
          # Pinned via global.json, not a floating 10.0.x. An unpinned SDK is a mutable
          # dependency re-resolved on every run — the same hazard this workflow already
          # avoids by pinning every action to a commit SHA.
          global-json-file: global.json
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: mkdir -p .nupkg-local && dotnet build --nologo
      - name: BDD scenarios
        if: needs.changes.outputs.code == 'true'
        # Category=bdd comes from the @bdd tag on each feature file. The scenarios
        # carry no Speed trait, so Speed=Fast never matched them and they gated
        # nothing until this job existed. BddGateCoverageTests fails if a feature
        # file is ever added without the tag.
        run: dotnet test --filter "Category=bdd" --no-build --nologo -v m

  build-slow:
    # The integration/E2E gate. Until 2026-08-08 nothing in the PR gate ran these:
    # build-fast filters Speed=Fast and build-bdd filters Category=bdd, so every
    # Speed=Slow test was merged unverified. #126 landed four red ingest tests
    # through a fully green PR that way. nightly.yml was the nominal backstop and
    # had failed on every run it ever had, so it could not signal anything.
    #
    # Runs beside the other two jobs, so the coverage costs concurrency, not wall
    # clock. The "~3m30s of test time" this comment used to claim went stale as the
    # suite grew: run 32048870721 (2026-08-17) spent 13m56s on 826 Speed=Slow tests,
    # and run 32052100773 was KILLED at the old 20-minute ceiling — so main carried a
    # tagged, published 1.26.0 with no verdict at all, because the gate timed out
    # rather than answering. A gate that randomly cannot finish reports nothing; sized
    # here at roughly 2x the measured 14 minutes so growth shows up as a slow gate
    # instead of a silent one. Re-measure when this comment looks old again.
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # #150: one SIGBUS (exit 135) test-host crash was observed here with no
      # diagnostic evidence; capture a crash dump so a recurrence is debuggable.
      DOTNET_DbgEnableMiniDump: 1
      DOTNET_DbgMiniDumpType: 2
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/dumps/coredump.%p.dmp
    steps:
      - name: Skip (doc-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-relevant paths changed; skipping build and tests."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.code == 'true'
        with:
          # Pinned via global.json, not a floating 10.0.x. An unpinned SDK is a mutable
          # dependency re-resolved on every run — the same hazard this workflow already
          # avoids by pinning every action to a commit SHA.
          global-json-file: global.json
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: mkdir -p .nupkg-local && dotnet build --nologo
      - name: Prepare dump directory
        if: needs.changes.outputs.code == 'true'
        run: mkdir -p dumps
      - name: Slow tests (integration + E2E)
        if: needs.changes.outputs.code == 'true'
        # GoldenFileTests skips itself off osx-arm64 — the golden reference is a
        # host-specific ONNX artifact, not a portable expectation.
        run: dotnet test --filter "Speed=Slow" --no-build --nologo -v m
      - name: Triage crash dumps
        if: failure()
        # A test-host segfault reads as "Passed! 167" followed by a bare "exit code 1"; this
        # names the signal and the module that faulted, so the next occurrence is triaged from
        # the log instead of by downloading half a gigabyte (scripts/src/coredump.py).
        run: |
          shopt -s nullglob
          for dump in dumps/*.dmp; do
            python3 scripts/triage-coredump.py "$dump"
          done

      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-slow-dumps
          path: dumps/
          if-no-files-found: ignore

  build-nightly-gates:
    # Q2 (delta review fix plan, owner flag O1): nothing ran Speed=Nightly against a PR head.
    # nightly.yml already has workflow_dispatch, but dispatching it runs the full unfiltered
    # ~45-minute suite and files a red-nightly issue on failure (scripts/nightly-triage.py) — wrong
    # for a PR's own red. This job runs only the Nightly-tagged tests, with no triage script, and
    # is not a required status check (unlike build-fast/build-bdd/build-slow above) — it only runs
    # when explicitly asked for, via the `run-nightly-gates` label or a manual dispatch, so it
    # never adds cost to a PR that doesn't want it.
    needs: changes
    if: |
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.pull_request.labels.*.name, 'run-nightly-gates'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # Pinned via global.json, not a floating 10.0.x. An unpinned SDK is a mutable
          # dependency re-resolved on every run — the same hazard this workflow already
          # avoids by pinning every action to a commit SHA.
          global-json-file: global.json
      - name: Build
        run: mkdir -p .nupkg-local && dotnet build --nologo
      - name: Nightly-tagged tests
        # Speed=Nightly only. Deliberately does not call scripts/nightly-triage.py: that script's
        # red-nightly issue is for the scheduled unattended backstop, not a PR the author is
        # already looking at — a red here fails this check, full stop.
        run: dotnet test --filter "Speed=Nightly" --no-build --nologo -v m
