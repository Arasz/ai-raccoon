name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-fast:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        # nuget.config references the gitignored local feed .nupkg-local/; make it
        # exist on the fresh runner or restore fails with NU1301.
        run: mkdir -p .nupkg-local && dotnet build --nologo
      - name: Fast tests
        # Fast-only gate: full suite runs nightly (nightly.yml) — the Speed trait
        # split is defined in tests/AiRaccoon.Tests/TestCategories.cs.
        run: dotnet test --filter "Speed=Fast" --no-build --nologo -v m

  build-bdd:
    # Separate job, not a second step: it runs beside build-fast rather than after
    # it, so gating the BDD scenarios costs concurrency instead of wall-clock.
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: mkdir -p .nupkg-local && dotnet build --nologo
      - name: BDD scenarios
        # Category=bdd comes from the @bdd tag on each feature file. The scenarios
        # carry no Speed trait, so Speed=Fast never matched them and they gated
        # nothing until this job existed. BddGateCoverageTests fails if a feature
        # file is ever added without the tag.
        run: dotnet test --filter "Category=bdd" --no-build --nologo -v m
