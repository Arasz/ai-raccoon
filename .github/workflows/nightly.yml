# Full test suite, unfiltered — the one run with no --filter at all, so it also
# covers anything a trait typo would hide from the three per-PR jobs.
#
# Since 2026-08-08 the PR gate runs Speed=Slow too (build.yml build-slow), so this
# is a backstop rather than the only integration coverage. It had failed on every
# run it ever had before then, which is exactly why a red main went unnoticed:
# a permanently-failing backstop signals nothing.
#
# Since 2026-08-19 the test step is scripts/nightly-triage.py: the suite runs once
# (still unfiltered), failures are re-run once in isolation and classified
# (flake candidate / regression / known flake via known-flakes.json), trx + serve
# logs upload as the nightly-diagnostics artifact on red, and an unledgered red
# files or comments a 'nightly'-labelled issue. Exit 0 means "green or only known
# flakes" — the repo's record-and-tolerate policy, decided by the workflow itself.
#
# Timeout 45 min: measured 16m49s (2026-08-19) + the isolated rerun of the failed
# tests on a red night + upload slack. Split into two jobs (Speed=Nightly /
# Speed!=Nightly — complementary filters, so the backstop property survives) when
# a run is killed by the timeout or typical duration reaches ~35 min. NOTE: a
# job-level timeout kill aborts the runner before the upload step — a split is
# also the fix for the no-artifacts-on-timeout case.
#
# ⚠️ SCHEDULED RUNS ARE BEST-EFFORT. GitHub documents `schedule` as subject to
# delay during periods of high load, and runs can be dropped entirely — there is
# no retry and nothing goes red when a window is missed. Absence of a nightly
# run is NOT evidence that anything passed. Check with:
#   gh run list --workflow=nightly.yml
# and re-arm/verify on demand with:
#   gh workflow run nightly.yml
#
# GraphPooledOutputParityTests (WP5, ledger docs/work/2026-08-22-post-delta-continuation-plan.md
# row "Parity-gate wiring"): the only gate that can see a wrongly-pooled vector (PR #437's
# mutation table — off-by-one pooled row is invisible to every shape/norm check). It needs a real
# dual-output model on disk and was Nightly-tagged but skipping everywhere, gated on
# AIRACCOON_POOLING_PARITY_MODEL_DIR with nothing setting it. Design chosen (A over B/C, measured):
#   - Candidate B (a smaller dual-output model under ~500 MB): searched HF for an ONNX export that
#     names BOTH a pooled output and a token-level output. sentence-transformers' own ONNX export
#     path only ever emits last_hidden_state (token embeddings) — pooling is applied client-side,
#     never baked into the graph as a second named output (confirmed against the ONNX Runtime /
#     sentence-transformers docs and export guides). The baked pooled-output pattern this gate
#     exists to check is specific to BGE-M3's multi-functionality export (dense + sparse + ColBERT
#     heads in one graph); every repo carrying it is a BGE-M3 derivative, all >2 GB. No smaller
#     candidate found — B rejected.
#   - Candidate C (owner-local only, no CI): rejected — A is affordable (below), so a "gate in name
#     only" would persist for no reason.
#   - Candidate A (provision bge-m3 here, cached): chosen. `ai-raccoon model download BAAI/bge-m3
#     --dir <dir> --yes` is the product's own download path (docs/how-to/configure-embedding-
#     engines.md Recipe 4) — using it here means the CI gate exercises the same code a user runs.
#     Measured (dry-run resolve, 2026-08-22): 5 files, 2,272,616,453 bytes (~2.27 GB) total: model.onnx
#     (725 KB, external-data stub), model.onnx_data (~2.27 GB, the LFS-pinned weights),
#     sentencepiece.bpe.model (~5 MB), config.json + tokenizer_config.json (TOFU-pinned, <2 KB).
#     Repo Actions-cache usage measured 2026-08-22: 0 bytes / 0 caches active against the 10 GB repo
#     cap — a ~2.3 GB entry keyed on the pinned manifest fixture's hash costs ~23% of the cap today
#     and evicts nothing. Cold-run download + full-suite time is the first real run's own numbers,
#     recorded in the PR; warm (cache-hit) runs skip the download step entirely.
#   - Scope: build-nightly-gates (build.yml, the PR-label lane) deliberately does NOT get this. It
#     exists so a PR author can get Nightly-tagged feedback without paying nightly.yml's ~45-minute
#     backstop cost; adding a mandatory 2.3 GB download to every `run-nightly-gates`-labelled PR
#     defeats that purpose and buys nothing most PRs touch (embedding-pooling changes are rare and
#     already covered here, on the schedule this ledger row asks for).
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The triage script files/comments the red-nightly issue (gh CLI, native — no
  # third-party action, matching release.yml's GH_TOKEN precedent).
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Same crash-dump capture build-slow carries: a test-host SIGBUS must be
      # diagnosable from the artifacts, not a bare "exit code 1".
      DOTNET_DbgEnableMiniDump: 1
      DOTNET_DbgMiniDumpType: 2
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/dumps/coredump.%p.dmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore bge-m3 (pooling parity gate)
        id: parity-model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bge-m3
          key: bge-m3-pooling-parity-v1-${{ hashFiles('tests/AiRaccoon.Tests/Resources/ManifestFixtures/bge-m3.full.json') }}
      - name: Download bge-m3 (pooling parity gate)
        if: steps.parity-model-cache.outputs.cache-hit != 'true'
        # Same download path a user takes (docs/how-to/configure-embedding-engines.md Recipe 4):
        # `ai-raccoon model download`, run via `dotnet run` rather than an installed tool since the
        # solution is not packed in this job. --yes skips the >500 MB confirmation prompt.
        run: |
          mkdir -p .nupkg-local
          dotnet run --project src/AiRaccoon --no-launch-profile -- \
            model download BAAI/bge-m3 --dir "${{ runner.temp }}/bge-m3" --yes
      - name: Full suite + failure triage
        env:
          GH_TOKEN: ${{ github.token }}
          AIRACCOON_POOLING_PARITY_MODEL_DIR: ${{ runner.temp }}/bge-m3
        # nuget.config references the gitignored local feed .nupkg-local/; make it
        # exist on the fresh runner or restore fails with NU1301. dumps/ must exist
        # too, or the crash-dump env vars above cannot write (build-slow mkdirs it).
        run: mkdir -p .nupkg-local dumps && python3 scripts/nightly-triage.py
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-diagnostics
          path: |
            TestResults/
            dumps/
          if-no-files-found: ignore
