<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AiRaccoon logo proposition C: the bandit mask as a memory module">
  <title>AiRaccoon — Mask Mark</title>

  <defs>
    <linearGradient id="c-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202C"/>
      <stop offset="1" stop-color="#0A1017"/>
    </linearGradient>
    <linearGradient id="c-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F5F8"/>
      <stop offset="1" stop-color="#C0CCD9"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#c-field)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#2BD9C0" stroke-opacity=".3" stroke-width="3"/>

  <!-- ears: pointed ovals, dark inner, teal node -->
  <g stroke="#0A1017" stroke-width="4.5">
    <g transform="rotate(-24 92 56)">
      <ellipse cx="92" cy="56" rx="15" ry="19" fill="url(#c-fur)"/>
      <ellipse cx="92" cy="58" rx="7.5" ry="10.5" fill="#1B232E" stroke="none"/>
      <circle cx="92" cy="59" r="3.2" fill="#2BD9C0" stroke="none"/>
    </g>
    <g transform="rotate(24 164 56)">
      <ellipse cx="164" cy="56" rx="15" ry="19" fill="url(#c-fur)"/>
      <ellipse cx="164" cy="58" rx="7.5" ry="10.5" fill="#1B232E" stroke="none"/>
      <circle cx="164" cy="59" r="3.2" fill="#2BD9C0" stroke="none"/>
    </g>
  </g>

  <!-- the mask: one tapered band, reading as both mask and memory module;
       the bottom edge dips at the centre like the mask bridging the nose -->
  <path d="M62 92 Q64 72 96 70 L160 70 Q192 72 194 92 L200 122 Q196 146 174 150 Q158 153 146 146 Q136 140 128 140 Q120 140 110 146 Q98 153 82 150 Q60 146 56 122 Z" fill="#161C24"/>
  <path d="M62 92 Q64 72 96 70 L160 70 Q192 72 194 92 L200 122 Q196 146 174 150 Q158 153 146 146 Q136 140 128 140 Q120 140 110 146 Q98 153 82 150 Q60 146 56 122 Z" fill="none" stroke="#2BD9C0" stroke-opacity=".35" stroke-width="3"/>

  <!-- eyes -->
  <g>
    <circle cx="102" cy="118" r="15" fill="#0B1017"/>
    <circle cx="154" cy="118" r="15" fill="#0B1017"/>
    <circle cx="102" cy="118" r="11" fill="#2BD9C0"/>
    <circle cx="154" cy="118" r="11" fill="#2BD9C0"/>
    <circle cx="102" cy="118" r="5.2" fill="#07272C"/>
    <circle cx="154" cy="118" r="5.2" fill="#07272C"/>
    <circle cx="105" cy="114.5" r="3.4" fill="#FFFFFF"/>
    <circle cx="157" cy="114.5" r="3.4" fill="#FFFFFF"/>
  </g>

  <!-- the trace: a data bus running under the eyes, with a node -->
  <g fill="none" stroke="#2BD9C0" stroke-width="3.6" stroke-linecap="round">
    <path d="M72 136 Q100 130 128 130 Q156 130 184 136"/>
  </g>
  <circle cx="128" cy="130" r="5" fill="#2BD9C0"/>

  <!-- white muzzle wedge with dark nose, for the face to read at small sizes -->
  <path d="M112 140 Q128 158 144 140 Q138 176 128 176 Q118 176 112 140Z" fill="#F7FAFC"/>
  <path d="M120 152h16q2.5 0 2.5 2.5q0 7.5-10.5 10-10.5-2.5-10.5-10q0-2.5 2.5-2.5z" fill="#161C24"/>

  <!-- field circuitry, echoing the badge family -->
  <g stroke="#2BD9C0" stroke-opacity=".4" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M26 96V64h26"/>
    <path d="M230 96V64h-26"/>
  </g>
  <g fill="#2BD9C0" fill-opacity=".55">
    <circle cx="52" cy="64" r="4"/><circle cx="204" cy="64" r="4"/>
  </g>
</svg>
