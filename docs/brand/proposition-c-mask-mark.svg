<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AiRaccoon logo proposition C: the bandit mask as a memory module">
  <title>AiRaccoon — Mask Mark</title>

  <defs>
    <linearGradient id="c-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202C"/>
      <stop offset="1" stop-color="#0A1017"/>
    </linearGradient>
    <linearGradient id="c-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F5F8"/>
      <stop offset="1" stop-color="#C0CCD9"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#c-field)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#2BD9C0" stroke-opacity=".3" stroke-width="3"/>

  <!-- ears -->
  <g stroke="#0A1017" stroke-width="4.5">
    <circle cx="92" cy="58" r="17" fill="url(#c-fur)"/>
    <circle cx="164" cy="58" r="17" fill="url(#c-fur)"/>
    <circle cx="92" cy="59" r="8.5" fill="#1B232E" stroke="none"/>
    <circle cx="164" cy="59" r="8.5" fill="#1B232E" stroke="none"/>
    <circle cx="92" cy="59" r="3.6" fill="#2BD9C0" stroke="none"/>
    <circle cx="164" cy="59" r="3.6" fill="#2BD9C0" stroke="none"/>
  </g>

  <!-- the mask: one band, reading as both mask and memory module -->
  <rect x="60" y="86" width="136" height="72" rx="18" fill="#161C24"/>
  <rect x="60" y="86" width="136" height="72" rx="18" fill="none" stroke="#2BD9C0" stroke-opacity=".35" stroke-width="3"/>

  <!-- eyes -->
  <g>
    <circle cx="104" cy="122" r="15" fill="#0B1017"/>
    <circle cx="152" cy="122" r="15" fill="#0B1017"/>
    <circle cx="104" cy="122" r="11" fill="#2BD9C0"/>
    <circle cx="152" cy="122" r="11" fill="#2BD9C0"/>
    <circle cx="104" cy="122" r="5.4" fill="#07272C"/>
    <circle cx="152" cy="122" r="5.4" fill="#07272C"/>
    <circle cx="107.5" cy="118" r="3.6" fill="#FFFFFF"/>
    <circle cx="155.5" cy="118" r="3.6" fill="#FFFFFF"/>
  </g>

  <!-- the trace: a data bus running under the eyes, with a node -->
  <g fill="none" stroke="#2BD9C0" stroke-width="3.6" stroke-linecap="round">
    <path d="M74 144 Q100 138 128 138 Q156 138 182 144"/>
  </g>
  <circle cx="128" cy="138" r="5" fill="#2BD9C0"/>

  <!-- contact pins: the mask's bottom edge as a module connector -->
  <g fill="#2BD9C0">
    <rect x="92" y="166" width="10" height="14" rx="4"/>
    <rect x="123" y="166" width="10" height="14" rx="4"/>
    <rect x="154" y="166" width="10" height="14" rx="4"/>
  </g>

  <!-- white muzzle wedge, for the face to read at small sizes -->
  <path d="M112 150 Q128 172 144 150 Q138 186 128 186 Q118 186 112 150Z" fill="#F7FAFC"/>
  <path d="M122 162h12q2 0 2 2q0 6-8 9-8-3-8-9q0-2 2-2z" fill="#161C24"/>

  <!-- field circuitry, echoing the badge family -->
  <g stroke="#2BD9C0" stroke-opacity=".4" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M26 96V64h26"/>
    <path d="M230 96V64h-26"/>
  </g>
  <g fill="#2BD9C0" fill-opacity=".55">
    <circle cx="52" cy="64" r="4"/><circle cx="204" cy="64" r="4"/>
  </g>
</svg>
