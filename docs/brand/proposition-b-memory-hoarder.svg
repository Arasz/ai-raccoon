<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AiRaccoon logo proposition B: a raccoon cradling a glowing memory crystal">
  <title>AiRaccoon — The Memory Hoarder</title>

  <defs>
    <linearGradient id="b-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202C"/>
      <stop offset="1" stop-color="#0A1017"/>
    </linearGradient>
    <linearGradient id="b-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F5F8"/>
      <stop offset="1" stop-color="#C0CCD9"/>
    </linearGradient>
    <linearGradient id="b-gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FE9DC"/>
      <stop offset="1" stop-color="#1FA88F"/>
    </linearGradient>
    <radialGradient id="b-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2BD9C0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2BD9C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#b-field)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#2BD9C0" stroke-opacity=".3" stroke-width="3"/>

  <!-- soft halo behind the raccoon -->
  <circle cx="128" cy="116" r="86" fill="url(#b-glow)"/>

  <!-- body -->
  <path d="M84 118 Q76 152 82 172 Q88 198 128 198 Q168 198 174 172 Q180 152 172 118 Q128 104 84 118Z" fill="url(#b-fur)"/>
  <ellipse cx="128" cy="172" rx="40" ry="22" fill="#E4EBF3"/>

  <!-- ringed tail, curled across the bottom, in front of the body -->
  <g stroke="#0A1017" stroke-width="3" stroke-opacity=".35">
    <rect x="70" y="178" width="46" height="20" rx="10" fill="#E4EBF3"/>
    <rect x="116" y="178" width="32" height="20" rx="10" fill="#1B232E"/>
    <rect x="148" y="178" width="44" height="20" rx="10" fill="#E4EBF3"/>
  </g>
  <circle cx="192" cy="188" r="10" fill="#E4EBF3" stroke="#0A1017" stroke-width="3" stroke-opacity=".35"/>

  <!-- head -->
  <ellipse cx="128" cy="86" rx="46" ry="44" fill="url(#b-fur)"/>

  <!-- ears: pointed ovals, dark inner, teal node -->
  <g stroke="#0A1017" stroke-width="4">
    <g transform="rotate(-26 90 44)">
      <ellipse cx="90" cy="44" rx="13" ry="17" fill="url(#b-fur)"/>
      <ellipse cx="90" cy="46" rx="6.5" ry="9" fill="#1B232E" stroke="none"/>
      <circle cx="90" cy="47" r="2.8" fill="#2BD9C0" stroke="none"/>
    </g>
    <g transform="rotate(26 166 44)">
      <ellipse cx="166" cy="44" rx="13" ry="17" fill="url(#b-fur)"/>
      <ellipse cx="166" cy="46" rx="6.5" ry="9" fill="#1B232E" stroke="none"/>
      <circle cx="166" cy="47" r="2.8" fill="#2BD9C0" stroke="none"/>
    </g>
  </g>

  <!-- white forehead patch, above the mask -->
  <ellipse cx="128" cy="58" rx="26" ry="11" fill="#F7FAFC"/>

  <!-- the bandit mask: one continuous band -->
  <path d="M82 84 Q84 62 108 60 L148 60 Q172 62 174 84 L178 106 Q176 132 154 138 Q140 142 128 136 Q116 142 102 138 Q80 132 78 106 Z" fill="#161C24"/>

  <!-- white spectacles within the mask -->
  <circle cx="104" cy="98" r="10" fill="#F2F5F8"/>
  <circle cx="152" cy="98" r="10" fill="#F2F5F8"/>

  <!-- eyes -->
  <g>
    <circle cx="104" cy="98" r="8" fill="#0B1017"/>
    <circle cx="152" cy="98" r="8" fill="#0B1017"/>
    <circle cx="104" cy="98" r="5.8" fill="#2BD9C0"/>
    <circle cx="152" cy="98" r="5.8" fill="#2BD9C0"/>
    <circle cx="104" cy="98" r="2.8" fill="#07272C"/>
    <circle cx="152" cy="98" r="2.8" fill="#07272C"/>
    <circle cx="106.5" cy="95.5" r="2.1" fill="#FFFFFF"/>
    <circle cx="154.5" cy="95.5" r="2.1" fill="#FFFFFF"/>
  </g>

  <!-- muzzle: short, ending above the crystal; nose at its end -->
  <path d="M108 128 Q128 122 148 128 L152 144 Q150 152 128 154 Q106 152 104 144 Z" fill="#F7FAFC"/>
  <path d="M119 138h18q3 0 3 3q0 7-12 9-12-2-12-9q0-3 3-3z" fill="#161C24"/>
  <g fill="none" stroke="#161C24" stroke-width="2.8" stroke-linecap="round">
    <path d="M124 150q4 3 8 0"/>
  </g>

  <!-- whiskers -->
  <g fill="none" stroke="#F7FAFC" stroke-width="2.2" stroke-linecap="round" stroke-opacity=".5">
    <path d="M112 134Q92 130 78 136"/>
    <path d="M110 142Q90 142 76 150"/>
    <path d="M144 134Q164 130 178 136"/>
    <path d="M146 142Q166 142 180 150"/>
  </g>

  <!-- the memory: a glowing crystal cradled in the paws -->
  <circle cx="128" cy="170" r="26" fill="url(#b-glow)"/>
  <g stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2">
    <path d="M128 152 L146 162 L146 182 L128 192 L110 182 L110 162 Z" fill="url(#b-gem)" stroke="none"/>
    <path d="M128 152 L128 192"/>
    <path d="M110 162 L146 162"/>
    <path d="M110 182 L146 182"/>
    <path d="M128 152 L110 162 M128 152 L146 162"/>
  </g>
  <path d="M128 154 L138 161 L128 164 L118 161 Z" fill="#FFFFFF" fill-opacity=".65"/>

  <!-- paws holding the crystal -->
  <g fill="#E4EBF3" stroke="#0A1017" stroke-width="3.5" stroke-linejoin="round">
    <ellipse cx="100" cy="172" rx="16" ry="11" transform="rotate(-18 100 172)"/>
    <ellipse cx="156" cy="172" rx="16" ry="11" transform="rotate(18 156 172)"/>
  </g>
  <g fill="none" stroke="#0A1017" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".45">
    <path d="M94 168v8M100 167v9"/>
    <path d="M162 168v8M156 167v9"/>
  </g>

  <!-- sparkles -->
  <g fill="#2BD9C0">
    <path d="M196 96 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M56 148 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4z"/>
  </g>
</svg>
